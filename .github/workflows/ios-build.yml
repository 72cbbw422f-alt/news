name: NEWSFLOW iOS Build

on:
  push:
    branches: [main, "foundation/**", "security/**"]
  pull_request:
    branches: [main, "foundation/**"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Xcode simulator build and tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project NEWSFLOW.xcodeproj -scheme NEWSFLOW

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project NEWSFLOW.xcodeproj \
            -scheme NEWSFLOW \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((d["udid"] for runtime in devices.values() for d in runtime if d["isAvailable"] and d["name"].startswith("iPhone")), ""))')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone Simulator found"
            exit 1
          fi
          xcodebuild \
            -project NEWSFLOW.xcodeproj \
            -scheme NEWSFLOW \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
