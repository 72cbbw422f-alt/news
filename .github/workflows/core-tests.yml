name: NEWSFLOW Core Tests

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Swift package tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run NEWSFLOWCore tests
        working-directory: NEWSFLOWCore
        run: swift test
